<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, World</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f172a;
    --fg: #f8fafc;
    --accent: #38bdf8;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100%;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
    text-align: center;
    padding: 24px;
  }

  main {
    max-width: 480px;
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    margin-bottom: 12px;
  }

  p {
    font-size: 1.1rem;
    line-height: 1.6;
    color: rgba(248, 250, 252, 0.75);
  }

  .accent {
    color: var(--accent);
  }
</style>
</head>
<body>
  <main>
    <h1>Hello, <span class="accent">World</span></h1>
    <p>This is a simple static page served from index.html.</p>
  </main>
</body>
</html>
